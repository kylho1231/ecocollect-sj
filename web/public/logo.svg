<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="ecoGrad" x1="10" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1EA886" />
      <stop offset="100%" stop-color="#147D64" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="50" y1="10" x2="80" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon (80x80) -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle Container -->
    <rect width="80" height="80" rx="20" fill="url(#ecoGrad)" />
    
    <!-- Recycling Flow Arc / Path -->
    <path d="M 40 18 A 22 22 0 0 1 62 40 C 62 48 57 55 50 59" stroke="#EAF7F0" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95" />
    <polygon points="48,53 53,62 43,62" fill="#EAF7F0" />

    <path d="M 40 62 A 22 22 0 0 1 18 40 C 18 32 23 25 30 21" stroke="#EAF7F0" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95" />
    <polygon points="32,27 27,18 37,18" fill="#EAF7F0" />

    <!-- Center Leaf & GPS Node -->
    <!-- Stylized Leaf -->
    <path d="M 40 26 C 48 30 52 38 48 46 C 44 54 36 50 34 46 C 30 40 34 28 40 26 Z" fill="#FFFFFF" />
    <!-- Leaf Center Rib / Tracking Pin Core -->
    <path d="M 36 46 Q 40 38 44 32" stroke="#147D64" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Pin Accent Dot -->
    <circle cx="41" cy="39" r="2.5" fill="#147D64" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(108, 22)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="#11263A">
      EcoCollect <tspan fill="#147D64">SJ</tspan>
    </text>

    <!-- Subtitle / Municipality -->
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5" fill="#64748B">
      SAN JOSE DE BUENAVISTA, ANTIQUE
    </text>

    <!-- Tagline Badge -->
    <g transform="translate(210, 40)">
      <rect x="0" y="0" width="95" height="16" rx="4" fill="#EAF7F0" />
      <text x="47.5" y="11.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#147D64" text-anchor="middle">
        SMART WASTE
      </text>
    </g>
  </g>
</svg>
